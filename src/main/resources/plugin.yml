name: SMPplugin
version: '${version}'

main: fr.antidino.smp.CorePlugin
api-version: '26.3'
load: STARTUP
commands :
  perk:
    permission : smp.admin.perk
    description: Commande Administrateur pour gérer les perks
  perks:
    description: Ouvre le codex des perks (liste, crafts, descriptions)
    usage: /perks codex
    permission: smp.perks.codex
permissions:
  smp.perks.codex:
    description: Permet d'ouvrir le codex des perks
    default: true
