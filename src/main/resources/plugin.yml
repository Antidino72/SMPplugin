name: SMPplugin
version: '${version}'

main: fr.antidino.smp.CorePlugin
api-version: '26.3'
load: STARTUP
commands :
  perk:
    permission : smp.admin.perk
    description: Commande Administrateur pour gérer les perks
  perks:
    description: Ouvre le codex des perks (liste, crafts, descriptions)
    usage: /perks codex
    permission: smp.perks.codex
  spell :
    description: Jete un sort
    permission: smp.spell
    usage: /spell [id]
permissions:
  smp.perks.codex:
    description: Permet d'ouvrir le codex des perks
    default: true
  smp.perks.codex.give :
    description: Permet de se Give des perks depuis le codex
